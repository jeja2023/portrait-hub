apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portrait-models
spec:
  accessModes: [ReadOnlyMany]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portrait-runtime-state
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 20Gi
