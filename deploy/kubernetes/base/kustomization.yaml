apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portrait-hub
resources:
  - namespace.yaml
  - service-account.yaml
  - configmap.yaml
  - storage.yaml
  - api.yaml
  - gpu-worker.yaml
  - video-worker.yaml
  - stream-worker.yaml
  - autoscaling.yaml
  - availability.yaml
  - network-policy.yaml
  - gateway-canary.yaml
  - migration-job.yaml
  - governance-cronjob.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: portrait-hub
      app.kubernetes.io/managed-by: kustomize
