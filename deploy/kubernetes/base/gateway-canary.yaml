apiVersion: apps/v1
kind: Deployment
metadata:
  name: portrait-hub-api-canary
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portrait-hub-api
      app.kubernetes.io/track: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portrait-hub-api
        app.kubernetes.io/component: api
        app.kubernetes.io/track: canary
    spec:
      serviceAccountName: portrait-hub
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/portrait-hub@sha256:1111111111111111111111111111111111111111111111111111111111111111
          args: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--limit-concurrency", "200"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FORCE_CPU
              value: "true"
            - name: APP_DEPLOYMENT_TRACK
              value: canary
          envFrom:
            - configMapRef:
                name: portrait-hub-config
            - secretRef:
                name: portrait-hub-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime-state
              mountPath: /workspace/runtime-state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-state
          persistentVolumeClaim:
            claimName: portrait-runtime-state
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portrait-hub-api-canary
spec:
  selector:
    app.kubernetes.io/name: portrait-hub-api
    app.kubernetes.io/track: canary
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portrait-hub
spec:
  parentRefs:
    - name: portrait-gateway
      namespace: gateway-system
  hostnames:
    - portrait.example.com
  rules:
    - matches:
        - headers:
            - name: x-tenant-id
              value: canary-tenant
        - headers:
            - name: x-project-id
              value: canary-project
        - headers:
            - name: x-model-version
              value: candidate
      backendRefs:
        - name: portrait-hub-api-canary
          port: 8000
          weight: 100
    - backendRefs:
        - name: portrait-hub-api
          port: 8000
          weight: 95
        - name: portrait-hub-api-canary
          port: 8000
          weight: 5
