name: ci

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements/dev.txt
      - name: Run ruff lint
        run: python -m ruff check app tools tests
      - name: Run strict type checks
        run: python tools/type_check.py

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements/dev.txt
      - name: Run Python tests with coverage
        run: python -m pytest -q --cov=app --cov=tools --cov-report=term --cov-report=xml --durations=15
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements/dev.txt
      - name: Install pinned frontend dependencies
        run: npm ci
      - name: Verify generated OpenAPI types
        run: |
          npm run console:generate
          git diff --exit-code -- frontend/console-next/src/api/generated.ts
      - name: Reject unreviewed breaking OpenAPI changes
        run: python tools/openapi_compatibility_check.py --json
      - name: Verify console frontend
        run: |
          npm run console:lint
          npm run console:test
          npm run console:typecheck
          npm run console:build
          test -f frontend/console-next/dist/index.html
          test -f frontend/console-next/dist/.vite/manifest.json
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium test engine
        run: npx playwright install --with-deps chromium
      - name: Run console Chromium acceptance
        run: >-
          npm run console:e2e --
          --project=chromium-desktop
          --project=chromium-tablet
          --project=chromium-mobile

  delivery-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements/dev.txt
      - name: Install pinned Node dependencies
        run: npm ci
      - name: Verify dependency lock policy
        run: python tools/deploy_check.py --json --skip-node
      - name: Run Node SDK contract tests
        run: node tests/test_node_sdk.js
      - name: Run Python SDK clean-environment smoke
        run: python tools/portrait_sdk_clean_smoke.py --json
      - name: Run deployment contract checks
        run: python tools/deploy_check.py --json
      - name: Run example model regression gates
        run: python tools/portrait_model_regression.py --manifest examples/portrait-model-regression.example.yml --json
      - name: Run example model A/B shadow gates
        run: python tools/portrait_model_regression.py --manifest examples/portrait-model-ab-shadow.example.yml --json
      - name: Run production readiness gate
        # scope=platform 保留模板/数据校验、安全/契约/模型文件检查，跳过需要真实生产模型产物的
        # 能力状态检查（CI runner 不携带这些大模型）。任何 strict 失败都会使该步骤非零退出。
        run: python tools/portrait_production_readiness.py --strict --scope platform
      - name: Verify commercial delivery controls
        run: |
          python tools/portrait_support_matrix.py --json
          python tools/portrait_support_matrix.py --render .codex-tmp/SUPPORT_MATRIX.md --json
          diff -u docs/deployment/SUPPORT_MATRIX.md .codex-tmp/SUPPORT_MATRIX.md
